[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sef-medfusion"
version = "0.1.0"
description = "Reproducible histology classification, gradient-confidence monitoring and RDF provenance"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "torch>=2.2,<3", "Pillow>=10,<13",
  "scikit-learn>=1.4,<2", "scipy>=1.12,<2", "matplotlib>=3.8,<4",
  "rdflib>=7.1,<8", "pyshacl>=0.30,<0.41", "py7zr>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10", "pypdf>=5,<7"]

[project.scripts]
sef-medfusion = "sef_medfusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sef_medfusion = ["resources/*.ttl", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

